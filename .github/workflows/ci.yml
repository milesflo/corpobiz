name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# No redscript compile here: scc needs the game's own final.redscripts, which
# can't live on a runner or in this repo. `make compile` runs locally via the
# pre-push hook instead.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
